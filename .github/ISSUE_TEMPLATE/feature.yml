name: Feature request
description: An option, a data format, or a speed-up Andrey should support; a new method has its own form.
labels: [feature]
body:
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task, and what stops you doing it with Andrey today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: For an option, how you would call it; for a data format, an example.
  - type: input
    id: size
    attributes:
      label: Data size
      description: Typical numbers of samples and variables, if speed matters.
