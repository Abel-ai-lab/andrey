<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="card-title card-desc"><title id="card-title">Andrey</title><desc id="card-desc">Andrey: accelerated, accurate, agentic. 27 supported methods. Data types: continuous, categorical, mixed, time series, nonlinear. Real data processing: missing values, background knowledge, edge confidence. Graphs: DAG, CPDAG, PAG, temporal; hidden confounders. Acceleration: parallel CPU; GPU with PyTorch (CUDA, MPS). Portability: NetworkX, pcalg, Graphviz DOT, NumPy. Interface: Python, CLI, skill.</desc><rect x="0.5" y="0.5" width="959" height="479" rx="18" fill="#fafbfc" stroke="#d9dde6"/><svg x="56" y="56" width="246.8" height="52" viewBox="2 -770 4514 951"><path fill="#182233" d="M2299 0H2491L2457 -299L2514 -770H2321L2283.9 -446.5Q2241.8 -511.7 2179 -548.5Q2115 -586 2035 -586Q1951 -586 1887.5 -548Q1824 -510 1788 -442.5Q1752 -375 1752 -285Q1752 -195 1788 -127.5Q1824 -60 1887.5 -22Q1951 16 2035 16Q2115 16 2179 -21.5Q2242.5 -58.7 2284.4 -125.5ZM594 -750H349L2 0H204L270.6 -151H672.2L739 0H940ZM3448 16Q3534 16 3608.5 -6Q3683 -28 3741 -68V-189Q3690 -157 3626 -139.5Q3562 -122 3498 -122Q3428 -122 3379.5 -143Q3331 -164 3305.5 -204Q3297.7 -216.2 3292.3 -230H3756Q3756 -338 3717 -418Q3678 -498 3606 -542Q3534 -586 3434 -586Q3336 -586 3258.5 -548Q3181 -510 3137 -443Q3093 -376 3093 -287Q3093 -196 3139 -128Q3185 -60 3265.5 -22Q3346 16 3448 16ZM3991 181Q4040 181 4085.5 165.5Q4131 150 4170 114Q4209 78 4237 18L4516 -570H4319L4143 -160.9L3970 -570H3766L4013 -45H4093.2L4091 -40Q4070 8 4038.5 26Q4007 44 3965 44Q3918 44 3878.5 31.5Q3839 19 3794 -10V121Q3838 151 3884.5 166Q3931 181 3991 181ZM973 -570 1009 -376V0H1195V-275Q1195 -324 1213.5 -359.5Q1232 -395 1265.5 -414.5Q1299 -434 1345 -434Q1410 -434 1445 -397.5Q1480 -361 1480 -290V0H1666V-318Q1666 -401 1635.5 -461Q1605 -521 1547.5 -553.5Q1490 -586 1408 -586Q1339 -586 1281.5 -553.5Q1224 -521 1185.5 -459Q1181.9 -453.2 1178.5 -447.1L1158 -570ZM2569