name: publish

# Build, check, and publish andrey-core with PyPI trusted publishing (OIDC; no API token stored).
# Each index needs a trusted publisher registered for this repository, this workflow file, and the
# job's environment (`testpypi` or `pypi`); without one the upload fails.
on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: PyPI publishes only from the tag v<version>
        # The package description's images point at that tag (pyproject.toml, fancy-pypi-readme).
        if: inputs.index == 'pypi'
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
            echo "::error::Run this workflow from the tag v$version, not $GITHUB_REF."
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Metadata, README render, and the packaging allowlist
        run: |
          uvx twine check --strict dist/*
          uv run --no-project python scripts/check_dist.py dist --list --readme
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        artifact: ["*.whl", "*.tar.gz"]
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Clean-venv install, import, and one fit
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install dist/${{ matrix.artifact }}
          uv run --no-project python -c "import importlib.util as u; assert u.find_spec('torch') is None; import numpy as np, andrey; print(andrey.__version__, andrey.pc(np.random.default_rng(0).standard_normal((500, 4))).structure.to_numpy())"

  # The release's quality gate (qa/README.md) runs on the release pull request into main, and a
  # squash merge keeps its tree. A passing run on the tree being published already checked these
  # files, so the gate below is skipped; any other tree, or a failed lookup, runs it here.
  gate-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: A passing quality-gate run on this commit's tree
        id: lookup
        # The script reports every failure as reuse=false; an empty output also runs the gate.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/gate_reuse.py

  quality-gate:
    needs: gate-lookup
    if: ${{ !cancelled() && needs.gate-lookup.outputs.reuse != 'true' }}
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read
      actions: read # the called workflow lists its earlier runs; it cannot ask for more than this

  publish-testpypi:
    needs: [build, install, gate-lookup, quality-gate]
    # A skipped gate counts only when the lookup found a passing run on this tree.
    if: >-
      ${{ !cancelled() && inputs.index == 'testpypi'
      && needs.build.result == 'success' && needs.install.result == 'success'
      && (needs.quality-gate.result == 'success'
      || (needs.quality-gate.result == 'skipped' && needs.gate-lookup.outputs.reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/andrey-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, install, gate-lookup, quality-gate]
    # A skipped gate counts only when the lookup found a passing run on this tree.
    if: >-
      ${{ !cancelled() && inputs.index == 'pypi'
      && needs.build.result == 'success' && needs.install.result == 'success'
      && (needs.quality-gate.result == 'success'
      || (needs.quality-gate.result == 'skipped' && needs.gate-lookup.outputs.reuse == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/andrey-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3