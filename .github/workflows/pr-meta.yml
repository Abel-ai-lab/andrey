name: pr-meta

# Labels, milestone, and CHANGELOG bullets of a pull request; the rules are in
# scripts/check_pr_meta.py and CONTRIBUTING.md. Drafts are checked too, and label and milestone
# changes rerun it; a closed pull request is skipped, so labeling it afterwards starts no check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, milestoned, demilestoned]

concurrency:
  group: pr-meta-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-meta:
    if: github.repository_owner == 'Abel-ai-lab' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The merge commit: its first parent is the base branch, and it carries the check script
      # even when the pull request's branch predates it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: One type label, a milestone, and the CHANGELOG bullets
        run: |
          git show HEAD^1:CHANGELOG.md > "$RUNNER_TEMP/base.md"
          python3 scripts/check_pr_meta.py --event "$GITHUB_EVENT_PATH" \
            --base "$RUNNER_TEMP/base.md" --head CHANGELOG.md
