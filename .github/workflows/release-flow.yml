name: release-flow

# Only a release branch merges to main (CONTRIBUTING.md, Pull requests): a pull request into main
# from any other branch fails this check, which the main ruleset requires, and so does a release
# branch whose package version is not the branch's <x.y.z>: the tag and the site take it. A post
# release, release/<x.y.z>.post<n>, fixes the site or the docs and keeps the package's <x.y.z>.
# `edited` reruns it when a pull request is retargeted to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  release-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: The pull request comes from release/<x.y.z> or release/<x.y.z>.post<n>
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ ! "$HEAD" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "::error::Only release/<x.y.z> merges to main, and this pull request comes from $HEAD. Target the release's branch instead."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: pyproject.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: The package version is the release branch's <x.y.z>
        env:
          HEAD: ${{ github.head_ref }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release=${HEAD#release/}
          release=${release%%.post*}
          if [[ "$version" != "$release" ]]; then
            echo "::error::$HEAD releases $release, but pyproject.toml says $version. Commit the version first: the tag and the site's llms.txt take it from the package."
            exit 1
          fi
