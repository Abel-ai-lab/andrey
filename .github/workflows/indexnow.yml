name: Tell search engines about a release

# The workflow submits every sitemap URL to IndexNow once a release is live.
# Bing, Yandex, Seznam, Naver, and other participating engines receive the submission.
# Google reads the sitemap named in robots.txt. The key is public by design: engines
# verify it against docs/_extra/<key>.txt on the site.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexnow:
    if: github.repository == 'Abel-ai-lab/andrey'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Wait for the release on the live site, then submit every address in its sitemap
        env:
          SITE: andrey.abel.ai
          KEY: f57e1cb079cc40b67a5dd117b8cd4dc4  # gitleaks:allow (public by design)
        shell: bash
        run: |
          set -euo pipefail
          # A tagged release is live when llms.txt names its version; manual runs submit the live site.
          # A post release (v<x.y.z>.post<n>) fixes the site and keeps the package's <x.y.z>, which
          # llms.txt already names, so it waits 10 minutes for the deploy instead (a release takes 8).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ "$version" == *.post* ]]; then
              version=${version%%.post*}
              sleep 600
            fi
            for _ in $(seq 100); do
              if curl -fsS "https://$SITE/llms.txt" | grep -qx "Version: $version."; then
                live=1
                break
              fi
              sleep 30
            done
            : "${live:?The site did not show $version within 50 minutes}"
          fi
          curl -fsS "https://$SITE/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | jq -R . | jq -s --arg host "$SITE" --arg key "$KEY" \
              '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: .}' \
            | curl -fsS -H 'Content-Type: application/json; charset=utf-8' --data @- \
              https://api.indexnow.org/indexnow
          echo "Submitted the sitemap's addresses to IndexNow." >> "$GITHUB_STEP_SUMMARY"
