# Sections of a GitHub release's generated notes, by pull request label. A pull request appears in
# the first section whose label it has. The CHANGELOG section is the record; the generated notes
# are checked against it. CONTRIBUTING.md lists the labels.
changelog:
  # The release's own pull request is the release; its notes list what it ships.
  exclude:
    labels: [release]
  categories:
    - title: Highlights
      labels: [highlight]
    - title: Breaking
      labels: [breaking]
    - title: Added
      labels: [feature]
    - title: Fixed
      labels: [bug]
    - title: Documentation
      labels: [docs]
    - title: Chores
      labels: [chore]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
