e>tau_max=5</code></td></tr><tr><th scope="row">LPCMCI</th><td><code>tau_max=3</code></td></tr><tr><th scope="row">ANM</th><td>defaults</td></tr><tr><th scope="row">PNL</th><td>defaults</td></tr><tr><th scope="row">GIN</th><td>defaults</td></tr><tr><th scope="row">RCD</th><td>defaults</td></tr><tr><th scope="row">BottomUpParceLiNGAM</th><td>defaults</td></tr></tbody></table></div><figcaption>The keyword arguments of every fit; a setting not listed is at its default.</figcaption></figure>
