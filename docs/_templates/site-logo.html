{#- The wordmark leads to the homepage, the site root. -#}
{%- set home = pathto('', 1) %}
<a class="navbar-brand logo" href="{{ home or './' }}" aria-label="Andrey home">
  <img src="{{ pathto('_static/wordmark-light.svg', 1) }}" class="logo__image only-light" alt="Andrey"/>
  <img src="{{ pathto('_static/wordmark-dark.svg', 1) }}" class="logo__image only-dark pst-js-only" alt="Andrey"/>
</a>
{#- The navbar's lens (docs/_static/glass.js draws its map; docs/_static/andrey.css applies it). -#}
<svg class="andrey-lens" aria-hidden="true" focusable="false">
  <filter id="andrey-lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="andrey-lens-map" result="map" preserveAspectRatio="none"/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="32" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
