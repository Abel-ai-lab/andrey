exclude: 'uv.lock'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        types: [yaml, python, markdown, toml, text]
      - id: trailing-whitespace
        types: [yaml, python, markdown, toml, text]
      - id: debug-statements          # also flags stray print()/pdb in the package
        types: [python]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
        types: [markdown]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # no secrets/identities reach the public branch

  # Local (not the astral-sh/ty-pre-commit mirror): ty resolves imports from the
  # project's synced env, so the numeric stack (numba/scipy/...) must be installed.
  # `uv run --group dev` guarantees that env; a standalone `uvx ty`/mirror hook can't
  # see it. The [tool.ty] config lives in pyproject.toml.
  - repo: local
    hooks:
      - id: ty
        name: ty (andrey + recovery helpers)
        entry: uv run --group dev ty check src/andrey tests/recovery/helpers qa/capture_baselines.py
        language: system
        pass_filenames: false
        files: ^(src/andrey/|tests/recovery/helpers/|qa/capture_baselines.py$)
